theme = "catppuccin_mocha"

# -- Editor ---------------------------------

[editor]
line-number = "relative"
color-modes = true
true-color = true
# cursorline = true

[editor.auto-save]
focus-lost = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "╎"
skip-levels = 1


# -- Keys ---------------------------------

[keys.normal]
X = ["extend_line_up", "extend_to_line_bounds"]
A-x = "extend_to_line_bounds"

[keys.normal.space]
# Launch Yazi file manager anchored to current file path, open chosen file in Helix,
# and send TTY escape codes (\x1b...) to prevent render artifacts & restore bracketed paste.
e = [
  ":sh rm -f /tmp/yazi-helix",
  ":insert-output yazi \"%{buffer_name}\" --chooser-file=/tmp/yazi-helix",
  ":insert-output echo \"\\x1b[?1049h\\x1b[?2004h\" > /dev/tty",
  ":open %sh{cat /tmp/yazi-helix}",
  ":redraw",
]

[keys.select]
X = ["extend_line_up", "extend_to_line_bounds"]
A-x = "extend_to_line_bounds"
